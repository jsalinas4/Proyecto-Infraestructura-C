name: Terraform Pipeline

on:
  push:
    branches: [ "develop" ]

  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a realizar'
        required: true
        default: 'plan'
        type: choice
        options:
        - plan
        - apply
      environment:
        description: 'Ambiente'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  terraform:
    name: 'Terraform ${{ github.event.inputs.action || ''plan'' }}'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
 
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.8.2

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: |
        ENV="${{ github.event.inputs.environment || 'staging' }}"
        echo "Ejecutando plan para ambiente: $ENV"
        terraform plan -var-file=${ENV}.terraform.tfvars -out=plan.out

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      run: |
        echo "Aplicando cambios de infraestructura"
        terraform apply plan.out
        echo "Infraestructura aplicada exitosamente"

