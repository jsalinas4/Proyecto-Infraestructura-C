security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

jenkins:
  systemMessage: "Jenkins configurado automáticamente por JCasC. ¡Bienvenido!"
  numExecutors: 2
  remotingSecurity:
    enabled: true

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: Administrator
          password: admin123

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  clouds:
    - docker:
        name: "docker-cloud"
        dockerApi:
          dockerHost:
            uri: "tcp://docker-agent:50000"
        templates:
          - labelString: "dentalagent"
            name: "dental-agent-template"
            remoteFs: "/home/jenkins/agent"
            instanceCapStr: "1"
            mode: NORMAL
            retentionStrategy:
              idleMinutes: 10
            connector:
              jnlp:
                user: "jenkins"
            dockerTemplateBase:
              image: hashicorp/terraform:latest
              dnsHosts:
                - "8.8.8.8"
              extraHosts:
                - "jenkins-master:172.18.0.2"

unclassified:
  location:
    url: "http://jenkins-master:8080"

credentials:
  system:
    domainCredentials:
      - domain:
          name: "_"
          description: "Global credentials"
        credentials:
          - usernamePassword:
              id: "aws-credentials"
              username: "${AWS_ACCESS_KEY_ID}"
              password: "${AWS_SECRET_ACCESS_KEY}"
              description: "AWS credentials for Terraform"
          - string:
              id: "aws-session-token"
              secret: "${AWS_SESSION_TOKEN}"
              description: "AWS session token"

jobs:
  - script: >
      pipelineJob('terraform-pipeline') {
        description('Pipeline CI/CD para Terraform')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('/var/jenkins_home/workspace/local-repo')
                }
                branches('develop')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
          }
        }
      }
